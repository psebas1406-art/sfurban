<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SF Urban — Women &amp; Men Activewear</title>
  <meta name="description" content="SF Urban: ropa urbana y activewear para mujer y hombre. Drop 01 disponible.">
  <meta name="theme-color" content="#0D0D0F">
  <meta property="og:title" content="SF Urban — Drop 01">
  <meta property="og:description" content="Dos letras, un solo movimiento.">
  <meta property="og:image" content="drop01-conjunto-burdeos.png">
  <link rel="icon" href="isotipo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="theme.js"></script>
</head>
<body data-page="home">

<main id="main" class="container app-enter" data-app>
  <!-- Perfil -->
  <section class="profile" aria-label="SF Urban">
    <button class="avatar" data-story="drop" aria-label="Ver historia del Drop 01"><span class="avatar__in" data-iso></span></button>
    <div class="profile__main">
      <h1 class="profile__handle" data-handle>sfurban</h1>
      <div class="profile__actions">
        <button class="btn btn--accent btn--sm" data-follow>Seguir</button>
        <button class="btn btn--ghost btn--sm" data-message>Mensaje</button>
        <button class="btn btn--ghost btn--sm" data-share aria-label="Compartir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 10 14M21 4l-6.5 16-3.5-6.5L4.5 10z"/></svg></button>
      </div>
      <ul class="profile__stats" data-stats></ul>
      <div class="profile__bio">
        <strong>SF Urban</strong>
        <span class="cat">Ropa · Women &amp; Men — Activewear</span><br>
        <span class="serif">Dos letras, un solo movimiento.</span><br>
        Drop 01 ya disponible 🔴 Envío gratis desde <span data-free></span><br>
        <a href="#club" data-follow-link>Únete al club → acceso anticipado</a>
      </div>
    </div>
  </section>

  <!-- Historias destacadas -->
  <section class="highlights" aria-label="Historias destacadas" data-highlights></section>

  <!-- Apartados -->
  <section aria-label="Contenido">
    <div class="ig-tabs" role="tablist" data-tabs></div>
    <div data-view></div>
  </section>
</main>

<!-- Ficha rápida (publicación) -->
<div class="post-modal" data-post-modal aria-hidden="true" role="dialog" aria-modal="true" aria-label="Prenda"></div>
<!-- Visor de historias -->
<div class="story" data-story-viewer aria-hidden="true" role="dialog" aria-modal="true" aria-label="Historia"></div>

<script src="layout.js"></script>
<script src="intro.js"></script>
<script src="home.js"></script>
</body>
</html>
